name: 🧪 Game Framework Tests
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: game-framework-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  game-framework-tests:
    runs-on: ubuntu-24.04
    name: Build & Test Game Framework
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup SCons
        run: |
          python -m pip install scons

      - name: Build Godot with tests
        run: |
          scons platform=linuxbsd target=editor dev_build=yes tests=yes compiledb=no -j$(nproc)

      - name: Run C++ unit tests
        run: |
          ./bin/Mu.linuxbsd.editor.dev.x86_64 --test --test-case="*CharacterManager*" --test-case="*GameCharacter*" --test-case="*ItemManager*" --headless

      - name: Run GDScript tests
        run: |
          timeout 30 ./bin/Mu.linuxbsd.editor.dev.x86_64 --headless --path ./Project/cpp-model --script res://tests/test_character_manager.gd 2>&1 | tee /tmp/gd_test_output.txt
          grep -q "ALL TESTS PASSED" /tmp/gd_test_output.txt
